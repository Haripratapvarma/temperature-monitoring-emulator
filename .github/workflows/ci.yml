name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  native-linux:
    name: Native (Linux, ASan/UBSan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S NativeProcessing -B NativeProcessing/build-asan -DCMAKE_BUILD_TYPE=Debug -DTL_SANITIZE=ON
      - name: Build
        run: cmake --build NativeProcessing/build-asan -j
      - name: Test
        run: ctest --test-dir NativeProcessing/build-asan --output-on-failure

  managed-linux:
    name: Managed (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build native library
        run: |
          cmake -S NativeProcessing -B NativeProcessing/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeProcessing/build -j
      - name: Test (cross-platform projects; WPF excluded)
        run: dotnet test TempLab.CrossPlatform.slnf -c Release --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-linux
          path: TestResults

  windows:
    name: Windows (native + WPF + tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build native library (MSVC)
        run: |
          cmake -S NativeProcessing -B NativeProcessing/build
          cmake --build NativeProcessing/build --config Release
          ctest --test-dir NativeProcessing/build -C Release --output-on-failure
      - name: Build all projects including WPF
        run: dotnet build TempLab.sln -c Release
      - name: Test
        run: dotnet test Tests/TempLab.Tests.csproj -c Release --no-build --logger "trx;LogFileName=tests.trx" --results-directory TestResults
      - name: Publish desktop app and emulator
        run: |
          dotnet publish DesktopApp/Wpf/TempLab.DesktopApp.csproj -c Release -o publish/DesktopApp
          dotnet publish Emulator/TempLab.Emulator.csproj -c Release -o publish/Emulator
          dotnet publish ConsoleClient/TempLab.ConsoleClient.csproj -c Release -o publish/ConsoleClient
      - uses: actions/upload-artifact@v4
        with:
          name: templab-windows
          path: publish
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-windows
          path: TestResults

  benchmark-smoke:
    name: Benchmark smoke run (Linux)
    runs-on: ubuntu-latest
    needs: managed-linux
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: |
          cmake -S NativeProcessing -B NativeProcessing/build -DCMAKE_BUILD_TYPE=Release
          cmake --build NativeProcessing/build -j
          dotnet build Benchmarks -c Release
          dotnet Benchmarks/bin/Release/net10.0/TempLab.Benchmarks.dll sustained --channels 4 --rate 1000 --seconds 20 | tee benchmark.md
          cat benchmark.md >> "$GITHUB_STEP_SUMMARY"
